<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar" class="sidebar d-flex flex-column h-100">

    <!-- Navigation -->
    <div class="list-group list-group-flush">

        <a th:href="@{/}"
           class="list-group-item list-group-item-action">
            <i class="bi bi-cloud-upload me-2"></i>
            Migration
        </a>

    </div>

    <!-- Instructions -->
    <div class="p-3 border-top">

        <h6 class="fw-bold mb-3">
            <i class="bi bi-info-circle me-2"></i>
            Instructions
        </h6>

        <ol class="small ps-3 mb-0">
            <li>Login to the Finance application.</li>
            <li>Copy the <strong>SESSIONID</strong> cookie.</li>
            <li>Upload the Finance migration workbook.</li>
            <li>Supported sheets are detected automatically.</li>
            <li>Unsupported sheets are skipped.</li>
            <li>Review the migration summary.</li>
        </ol>

    </div>

    <!-- Footer -->
    <div class="sidebar-footer mt-auto p-3 text-center">

        <small class="text-muted d-block">
            Finance Migration Tool
        </small>

        <small class="text-muted">
            Version 1.0
        </small>

    </div>

</div>

</body>
</html>
